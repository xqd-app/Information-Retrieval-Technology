[project]
name = "packetvoyage"
version = "0.1.0"
description = "MCP server & Agent Skill for educational network traceroute analysis and packet voyage storytelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.6.0",
    "mcp>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
packetvoyage = "packetvoyage.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
